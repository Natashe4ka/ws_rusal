gripper:
  id: hybrid-foam-jaws
  label: 'HYBRID: FOAM LIFT -> DEPLOY JAWS -> VACUUM OFF / MOCK CONTROL'
  mode: hybrid
  video_note: Custom hybrid research model. Vacuum pickup, deploy jaws after lift,
    verify grip with vacuum OFF. Foam/rib seal uncalibrated. Playback 1x simulation
    time.
  case_half_sizes:
  - 0.15
  - 0.075
  - 0.025
  case_center:
  - 0
  - 0
  - 0.025
  case_mass: 2.0
  color:
  - 0.1
  - 0.35
  - 0.7
  - 1
  holding_safety_factor: 2.0
  assumptions:
  - Configured 300x150 mm area, 20 mm foam; catalog supports these options.
  - Fifteen independently spring-supported rigid tiles approximate foam, not actual
    suction-cell CAD.
  - Case mass 2 kg, pad mass, stiffness and vacuum dynamics are assumptions.
  - 'Conservative seal baseline: grooves are NOT assumed sealed by foam.'
  - No measured leakage, pump curve or elastomer deformation; not a real-product performance
    prediction.
  - Custom combination, not a commercial product. Upper housing includes an assumed
    5.2 kg mechanical drive.
  - 'Custom deploy stage: 100 mm stroke, finite 300 N drive; flat fingers 120x16x70
    mm, 1 kg each.'
  - Jaw stroke 25 mm per side and force limit 1000 N per side. Grip is checked for
    1 second with vacuum off.
  sources:
  - https://www.piab.com/kenos-vacuum-gripping-systems/kvg/kenos-vacuum-gripper-kvg150
  - https://schunk.com/us/en/gripping-systems/parallel-gripper/pgn-plus-p/pgn-plus-p-200-1/p/000000000000318616
  require_post_lift_clamp: true
  extra_cases:
  - name: drive
    half_sizes:
    - 0.05
    - 0.117
    - 0.0455
    center:
    - 0
    - 0
    - 0.1005
    mass: 5.2
