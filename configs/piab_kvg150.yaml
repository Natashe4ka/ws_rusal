# Catalog-based envelope, NOT a manufacturer's validated digital twin.
gripper:
  id: piab-kvg150
  label: 'PIAB KVG150 300x150 / APPROXIMATE MODEL / MOCK CONTROL'
  mode: vacuum
  video_note: 'Catalog-based research approximation. Foam = 15 spring tiles; rib seal NOT validated. Not a manufacturer digital twin. Playback 1x simulation time.'
  case_half_sizes: [0.150, 0.075, 0.025]
  case_center: [0, 0, 0.025]
  case_mass: 2.0 # ASSUMED: configured mass not published on family page
  color: [0.10, 0.35, 0.70, 1]
  holding_safety_factor: 2.0
  assumptions:
    - 'Configured 300x150 mm area, 20 mm foam; catalog supports these options.'
    - 'Fifteen independently spring-supported rigid tiles approximate foam, not actual suction-cell CAD.'
    - 'Case mass 2 kg, pad mass, stiffness and vacuum dynamics are assumptions.'
    - 'Conservative seal baseline: grooves are NOT assumed sealed by foam.'
    - 'No measured leakage, pump curve or elastomer deformation; not a real-product performance prediction.'
  sources:
    - https://www.piab.com/kenos-vacuum-gripping-systems/kvg/kenos-vacuum-gripper-kvg150
vacuum:
  enabled: true
  layout: FOAM
  rectangle: [0.060, 0.050]
  cell_centers: [[-0.12,-0.05],[-0.12,0],[-0.12,0.05],[-0.06,-0.05],[-0.06,0],[-0.06,0.05],[0,-0.05],[0,0],[0,0.05],[0.06,-0.05],[0.06,0],[0.06,0.05],[0.12,-0.05],[0.12,0],[0.12,0.05]]
  pad_half_thickness: 0.010
  pad_center_z: -0.015
  pad_mass: 0.02
  compliance: 0.006
  spring_stiffness: 1500
  spring_damping: 8
jaws:
  enabled: false
heap_execution:
  minimum_live_cups: 8
pallet:
  layout: spaced
  grid: [5, 1]
  long_axis: y
  offset: [0, -0.20]
  gaps: [0.04, 0.04]
